# PostgreSQL + pgvector for ASD_AGENT (replaces the lost file
# D:\Carobud-ASD-master\Carobud-ASD-master\deployments\compose.rag.yml).
#
# Defaults match the running container "deployments-rag-db-1" on the original machine:
# compose project "deployments" (the folder name), service "rag-db", image digest, port 5433
# and data volume deployments_carobud_rag_data.
# The data volume is EXTERNAL: `docker compose down` never deletes the database, and the
# volume must exist first. Use tasks.ps1, which creates it when missing:
#
#   .\tasks.ps1 db-up                       # start existing DB, or create volume + container
#   .\tasks.ps1 db-bootstrap <file.dump>    # new machine: restore a backup into the empty DB
#
# deployments/rag-db.env (git-ignored) must define RAG_DB_PASSWORD; copy rag-db.env.example.
# The password only takes effect when a volume is initialised for the first time.
# Overrides (e.g. a second, isolated test cluster): ASD_DB_PROJECT, ASD_DB_VOLUME, ASD_DB_PORT
# in tasks.ps1, which pass RAG_DB_VOLUME / RAG_DB_PORT here and `-p <project>` to compose.

services:
  rag-db:
    # pgvector 0.8.6 on PostgreSQL 16.15, pinned by digest (same image as the 2026-10-30 build).
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_DB: asd_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in deployments/rag-db.env}
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-5433}:5432"   # local only; never expose publicly
    volumes:
      - carobud_rag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asd_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  carobud_rag_data:
    external: true
    name: ${RAG_DB_VOLUME:-deployments_carobud_rag_data}
